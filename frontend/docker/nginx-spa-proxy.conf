# nginx-spa-proxy.conf — Nuxt SPA + /api → Laravel (backend-laravel)
# Copied into the production stage of the frontend Dockerfile as the default server.
# HTTP (80) and HTTPS (443). Self-signed certificate for local dev.

# ===== HTTP =====
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Keep redirects relative so the published host port (for example :3000)
    # is never dropped from Location headers.
    absolute_redirect off;

    location /_nuxt/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Serve prerendered `<route>/index.html` directly instead of `$uri/`,
        # which makes nginx emit a directory redirect that loses the host port.
        try_files $uri $uri/index.html /200.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Proxy /api to Laravel API (compose service `laravel`)
    location ^~ /api/ {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Sanctum CSRF cookie for SPA session login
    location ^~ /sanctum/ {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ===== HTTPS =====
server {
    listen 443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Self-signed certificate for local dev (generated at image build time).
    ssl_certificate     /etc/nginx/ssl/mtmtp.local.crt;
    ssl_certificate_key /etc/nginx/ssl/mtmtp.local.key;

    # Keep redirects relative so the published host port (for example :3443)
    # is never dropped from Location headers.
    absolute_redirect off;

    location /_nuxt/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        # Serve prerendered `<route>/index.html` directly instead of `$uri/`,
        # which makes nginx emit a directory redirect that loses the host port.
        try_files $uri $uri/index.html /200.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Proxy /api to Laravel API (compose service `laravel`)
    location ^~ /api/ {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Sanctum CSRF cookie for SPA session login
    location ^~ /sanctum/ {
        proxy_pass http://laravel:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
