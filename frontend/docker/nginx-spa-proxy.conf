# nginx-spa-proxy.conf — serves the Nuxt SPA and proxies /api to Django backend
# This config is copied into the production stage of the frontend Dockerfile.

# SPA shell (index.html / 200.html) — never cache
location / {
    try_files $uri $uri/ /200.html;
}

# Proxy /api to Django backend (tenant API)
# The backend hostname `backend` resolves via Docker compose networking.
location ^~ /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
}

# Security headers for all responses
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;