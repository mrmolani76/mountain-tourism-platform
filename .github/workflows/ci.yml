# PR / push CI — backend lint + tests (MVP §6)
# Deploy-on-main is a separate workflow (todo 09); this file is testing only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mountain
          POSTGRES_PASSWORD: mountain
          POSTGRES_DB: mountain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mountain -d mountain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://mountain:mountain@localhost:5432/mountain_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: mountain
      POSTGRES_PASSWORD: mountain
      POSTGRES_DB: mountain_test
      SECRET_KEY: ci-only-not-for-production
      DEBUG: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend scaffold
        id: backend
        run: |
          if [ -f backend/manage.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Backend found — running lint and tests"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "backend/manage.py missing — skip until work item 03 (Django scaffold)"
          fi

      - name: Set up Python
        if: steps.backend.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install ruff pytest pytest-django
          else
            echo "No requirements.txt in backend/ — fail"
            exit 1
          fi

      - name: Ruff lint
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check .
          else
            echo "ruff not installed; skip lint"
          fi

      - name: Django system check
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: python manage.py check

      - name: Run tests
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: |
          if [ -f pytest.ini ] || [ -f pyproject.toml ] || [ -d tests ] || [ -d apps ]; then
            if command -v pytest >/dev/null 2>&1; then
              pytest -q
            else
              python manage.py test -v 1
            fi
          else
            python manage.py test -v 1
          fi

      - name: Skip notice
        if: steps.backend.outputs.present != 'true'
        run: echo "CI testing job skipped (no backend yet). Scaffold backend, then this job enforces lint+tests."
