# Deploy on merge to main — backend only (MVP §6)
# Build on GitHub → SSH copy → migrate → switch → reload → health check → rollback
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect backend scaffold
        id: backend
        run: |
          if [ -f backend/manage.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "backend/manage.py missing — skip deploy until scaffold (item 03)."
          fi

      - name: Set up Python
        if: steps.backend.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt — fail"
            exit 1
          fi

      - name: Run tests
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: python manage.py test -v 1 || python -m pytest -q

      - name: System check
        if: steps.backend.outputs.present == 'true'
        working-directory: backend
        run: python manage.py check

      - name: Deploy via SSH
        if: steps.backend.outputs.present == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/mtmtp/app
            RELEASES=$APP_DIR/releases
            CURRENT=$APP_DIR/current
            TIMESTAMP=$(date +%Y%m%d%H%M%S)
            NEW_RELEASE=$RELEASES/$TIMESTAMP

            mkdir -p $RELEASES
            # Copy new code
            cp -r $APP_DIR/backend $NEW_RELEASE 2>/dev/null || true
            # In real deploy: rsync from GitHub artifact instead

            cd $NEW_RELEASE/backend
            source /home/mtmtp/venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --noinput
            python manage.py check

            # Switch symlink
            ln -sfn $NEW_RELEASE $CURRENT
            sudo systemctl restart mtmtp

            # Health check
            sleep 3
            if curl -sf http://127.0.0.1:8000/api/health/ > /dev/null; then
              echo "Deploy OK — health check passed"
              # Keep last 5 releases
              ls -1dt $RELEASES/*/ | tail -n +6 | xargs rm -rf
            else
              echo "Health check FAILED — rolling back"
              PREV=$(ls -1dt $RELEASES/*/ | sed -n '2p')
              ln -sfn $PREV $CURRENT
              sudo systemctl restart mtmtp
              exit 1
            fi

      - name: Skip notice
        if: steps.backend.outputs.present != 'true'
        run: echo "Deploy skipped (no backend scaffold yet)."