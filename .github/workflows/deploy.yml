# Deploy on merge to main — backend only (MVP §6)
# Quality gate must pass first; deploy only on push to main.
# Uses a protected GitHub Environment `production` with environment-scoped secrets.

name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      quality_passed: ${{ steps.quality.run.success }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
            pip install ruff
          else
            echo "No requirements.txt in backend/ — fail"
            exit 1
          fi

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Migration consistency check
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Installed dependency compatibility
        working-directory: backend
        run: python -m pip check

  deploy:
    name: Deploy to VPS
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://vps.mountain-tourism.example.com
      # reviewers required for production deployments
      reviewers: team-backend

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No requirements.txt — fail"
            exit 1
          fi

      - name: Prepare release artifact
        working-directory: backend
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          RELEASE_DIR=releases/$TIMESTAMP
          mkdir -p $RELEASE_DIR
          # Copy source code, excluding runtime-only files
          rsync -av --exclude='.env' --exclude='db.sqlite3' --exclude='*.sqlite3' \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='*.pyo' \
            --exclude='ruff.cache' --exclude='.ruffile' . $RELEASE_DIR/
          echo "release_dir=$RELEASE_DIR" >> "$GITHUB_OUTPUT"

      - name: Transfer artifact to VPS
        uses: appleboy/scp-action@v0.3.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          path: /home/mtmtp/app/releases/$RELEASE_DIR_NAME/

      - name: Deploy release to current
        working-directory: backend
        run: |
          cd /home/mtmtp/app
          ln -sfn releases/$RELEASE_DIR_NAME current
          # Run migration check (check only, no-op if no changes)
          source venv/bin/activate
          python manage.py migrate --check --dry-run || true
          python manage.py check

      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            source /home/mtmtp/venv/bin/activate
            cd /home/mtmtp/app/current
            python manage.py check
            sudo systemctl restart mtmtp

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sleep 5
            if curl -sf http://127.0.0.1:8000/api/health/ > /dev/null 2>&1; then
              echo "Deploy OK — health check passed"
            else
              echo "Health check FAILED — rolling back"
              # Rollback to previous release
              PREV=$(ls -1dt /home/mtmtp/app/releases/*/ | sed -n '2p')
              ln -sfn $PREV /home/mtmtp/app/current
              sudo systemctl restart mtmtp
              exit 1
            fi

  # Pull request comment step
  pr-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Post comment
        uses: actions/github-script@v7
        with:
          github_event_name: pull_request
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'CI/CD: This pull request will not trigger production deployment. ' +
                    'Quality checks run on each push; merge to main for deployment.'
            })