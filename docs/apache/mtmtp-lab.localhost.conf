<VirtualHost *:80>
    ServerName lab.localhost
    ProxyPreserveHost On

    # Laravel (php artisan serve on :8000)
    ProxyPass /api http://127.0.0.1:8000/api
    ProxyPassReverse /api http://127.0.0.1:8000/api
    ProxyPass /sanctum http://127.0.0.1:8000/sanctum
    ProxyPassReverse /sanctum http://127.0.0.1:8000/sanctum

    # Nuxt dev (npm run dev on :3000)
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/mtmtp-lab-error.log
    CustomLog ${APACHE_LOG_DIR}/mtmtp-lab-access.log combined
</VirtualHost>
