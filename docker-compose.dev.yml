# Mountain Tourism Platform — backend dev stack (Docker).
# Postgres 16 + Django API + Nuxt SPA (static build via nginx). Dev only;
# prod path is gunicorn on VPS (item 08).
# Ports: 8010 (web) / 5433 (db host mapping) / 3000 (spa) — loopback only.
# Inventory stack on this machine uses 8080 / 3307 / 3001 / 3000(landing); do not collide.

name: mtmtp

services:
  db:
    image: postgres:16-alpine
    container_name: mtmtp_db
    environment:
      POSTGRES_DB: mountain_tourism
      POSTGRES_USER: mt_app
      POSTGRES_PASSWORD: devpass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mtmtp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt_app -d mountain_tourism"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtmtp_net

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtmtp_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: dev-only-docker-secret-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,db,mtmtp_web,.docker.test,.local.mountain.local
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: mountain_tourism
      DB_USER: mt_app
      DB_PASSWORD: devpass
      DB_HOST: db
      DB_PORT: "5432"
      TENANCY_CENTRAL_HOSTS: localhost,127.0.0.1,db,0.0.0.0,mt-saas.test
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./backend:/app/backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - mtmtp_net
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"

# Nuxt SPA (static build via nginx; same-origin /api proxied to web)
  spa:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Empty = SPA calls same-origin /api; nginx proxies to web:8000.
        NUXT_PUBLIC_API_BASE_URL: ""
        ENV: local
        NUXT_PUBLIC_ENABLE_REALTIME: "false"
        BACKEND_URL: http://web:8000
    container_name: mtmtp_spa
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mtmtp_net

networks:
  mtmtp_net:
    driver: bridge

volumes:
  mtmtp_pgdata:
