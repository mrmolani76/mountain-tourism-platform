# Mountain Tourism Platform — backend dev stack (Docker).
# Postgres 16 + Django API. Dev only; prod path is gunicorn on VPS (todo 08).
# Ports 8010 (web) / 5433 (db host mapping) to avoid clashes on this machine.

services:
  db:
    image: postgres:16-alpine
    container_name: mtmtp_db
    environment:
      POSTGRES_DB: mountain_tourism
      POSTGRES_USER: mt_app
      POSTGRES_PASSWORD: devpass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mtmtp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt_app -d mountain_tourism"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mtmtp_web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: dev-only-docker-secret-change-me
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,db,mtmtp_web,.docker.test
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: mountain_tourism
      DB_USER: mt_app
      DB_PASSWORD: devpass
      DB_HOST: db
      DB_PORT: "5432"
      TENANCY_CENTRAL_HOSTS: localhost,127.0.0.1,db,0.0.0.0,mt-saas.test
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./backend:/app/backend
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"

# Nuxt SPA (development)
  spa:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mtmtp_spa
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Public config baked at build time (ssr:false)
      NUXT_PUBLIC_API_BASE_URL: http://backend:8000
      NUXT_PUBLIC_ENABLE_REALTIME: "false"
      ENV: local
      # Backend URL for vite proxy (same-origin within compose network)
      BACKEND_URL: http://backend:8000
      # Hosts file entry so `lab.local.mountain.local` resolves inside containers
      # (matches ALLOWED_HOSTS .local.mountain.local entry)
      DOCKER_HOSTS_ENTRY: "127.0.0.1 lab.local.mountain.local"
    volumes:
      - ./frontend:/app:ro
      - /app/node_modules
    networks:
      - mtmtp_net
    depends_on:
      - web

networks:
  mtmtp_net:
    driver: bridge

volumes:
  mtmtp_pgdata:
