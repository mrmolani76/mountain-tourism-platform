# Mountain Tourism Platform — Laravel API + Nuxt SPA (Docker).
# Ports: 8010 (API) / 5433 (Postgres) / 3000 (SPA) — loopback only.
# Staff login host example: http://lab.localhost:3000 (Host header → tenant).
# SaaS host example: http://saas.localhost:3000 (central only).
#
# This machine may not run compose; setup machine: docker compose -f docker-compose.dev.yml up -d --build

name: mtmtp

services:
  db:
    image: postgres:16-alpine
    container_name: mtmtp_db
    environment:
      POSTGRES_DB: mountain_tourism
      POSTGRES_USER: mt_app
      POSTGRES_PASSWORD: devpass
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mtmtp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt_app -d mountain_tourism"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mtmtp_net

  laravel:
    build:
      context: ./backend-laravel
      dockerfile: Dockerfile
    container_name: mtmtp_laravel
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://mtmtp.local:8010
      FRONTEND_URL: http://mtmtp.local:3000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: mountain_tourism
      DB_USERNAME: mt_app
      DB_PASSWORD: devpass
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      TENANCY_CENTRAL_HOSTS: saas.mtmtp.local
      CENTRAL_DOMAIN: saas.localhost
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:3000,127.0.0.1,127.0.0.1:3000,mtmtp.local,mtmtp.local:3000,saas.mtmtp.local,saas.mtmtp.local:3000
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./backend-laravel:/app
      - ./backend-laravel/.env.docker:/app/.env
    networks:
      - mtmtp_net
    command: >
      sh -c "composer install --no-interaction --prefer-dist --ignore-platform-reqs
      && php artisan key:generate --force
      && php artisan migrate --force
      && php artisan tenants:provision-local lab --reset --with-saas-admin --host=mtmtp.local
      && php artisan serve --host=0.0.0.0 --port=8000"

  spa:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NUXT_PUBLIC_API_BASE_URL: ""
        ENV: local
        NUXT_PUBLIC_ENABLE_REALTIME: "false"
        BACKEND_URL: http://laravel:8000
    container_name: mtmtp_spa
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - laravel
    networks:
      - mtmtp_net

networks:
  mtmtp_net:
    driver: bridge

volumes:
  mtmtp_pgdata:
